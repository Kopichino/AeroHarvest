simulation:
  canyon_bounds:
    x_min: -500.0
    x_max: 500.0
    y_min: -500.0
    y_max: 500.0
    z_min: 10.0
    z_max: 300.0
  telemetry_rate_hz: 50.0
  control_rate_hz: 20.0
