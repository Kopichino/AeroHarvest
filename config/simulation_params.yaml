  thermal_inspection_targets:
    - id: 1
      position: [-380.0, 100.0, 90.0]
      radius: 35.0
      required_dwell_time_s: 8.0
    - id: 2
      position: [-150.0, 380.0, 110.0]
      radius: 40.0
      required_dwell_time_s: 10.0
    - id: 3
      position: [250.0, 350.0, 85.0]
      radius: 35.0
      required_dwell_time_s: 8.0

wind:
  mean_base_speed_range: [2.0, 12.0]
  gust_intensity: 3.0
  canyon_draft_factor: 1.6
  spatial_wavelength_m: 120.0
  gust_frequency_hz: 0.8
